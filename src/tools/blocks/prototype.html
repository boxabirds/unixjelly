<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Lexend:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #24133b; --ink-soft: #56467a; --card: #ffffff; --sky: #d4eeff; --sun: #fff0b3; --lilac: #eadcff; --mint: #d8f6e4;
  --berry: #ff4d6d; --lime: #62c934; --lemon: #ffc61a; --blue: #3a5bff; --orange: #ff8a2b; --grape: #9b5cff;
  --shadow: 2px 2px 0 var(--ink); --line: 1.5px; --soft: #cfc4de; --gold: #ffb800; --hover: 0 0 0 1.5px rgba(36, 19, 59, .5);
  --chosen: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold), 0 0 18px 6px rgba(255, 184, 0, .6);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 14.5px/1.45 Lexend, system-ui, sans-serif; font-variant-ligatures: none; }
code, .mono { font-family: 'JetBrains Mono', monospace; font-variant-ligatures: none; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; flex-wrap: wrap; }
header h1 { font: 400 22px 'Titan One', sans-serif; margin: 0; }
header p { margin: 0; color: var(--ink-soft); flex: 1; min-width: 220px; }
.views { display: flex; border: var(--line) solid var(--ink); border-radius: 8px; overflow: hidden; }
.views button { font: 500 12.5px Lexend, sans-serif; border: 0; border-left: 1px solid var(--soft); background: var(--card); color: var(--ink); padding: 3px 10px; cursor: pointer; }
.views button:first-child { border-left: 0; }
.views button[aria-pressed=true] { background: var(--lilac); font-weight: 600; }
main { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr); gap: 12px; padding: 0 16px 16px; height: calc(100vh - 92px); min-height: 400px; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } .panel { height: 75vh; } }
.panel { background: var(--card); border: var(--line) solid var(--ink); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel > h2 { font: 400 16px 'Titan One', sans-serif; margin: 0; padding: 8px 12px; border-bottom: var(--line) solid var(--ink); display: flex; justify-content: space-between; align-items: center; }
.panel > h2 small { font: 400 12px Lexend, sans-serif; color: var(--ink-soft); }

/* the palette of new blocks */
.palette { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--soft); }
.palette button, .tools button { font: 500 12.5px Lexend, sans-serif; border: var(--line) solid var(--ink); border-radius: 8px; padding: 3px 8px; background: var(--c, var(--lemon)); color: var(--ink); cursor: pointer; box-shadow: 1px 1px 0 var(--ink); }
.palette button:active, .tools button:active { transform: translate(1px, 1px); box-shadow: none; }
/* a "+" that can't add here: greyed, but still there to hover or click for help */
.palette button.off { opacity: .45; box-shadow: none; }
.help-pop { position: fixed; z-index: 12; max-width: 340px; background: #fff; border: var(--line) solid var(--ink); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 13px; }
.help-pop p { margin: 0 0 6px; }
.help-pop .acts { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.help-pop button { font: 500 12.5px Lexend, sans-serif; border: var(--line) solid var(--ink); border-radius: 8px; padding: 3px 9px; background: var(--lime); cursor: pointer; text-align: left; }
.help-pop button[data-help=into] { background: var(--lemon); }
.tools { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 12px; align-items: center; border-bottom: 1px solid var(--soft); min-height: 40px; }
.tools .lbl { font-weight: 600; margin-right: 4px; }
.tools .sw { width: 20px; height: 20px; padding: 0; border-radius: 50%; background: var(--sw); }
.tools .sw[aria-pressed=true] { outline: 2px solid var(--grape); outline-offset: 2px; }
.msg { padding: 2px 12px; min-height: 22px; font-size: 13px; font-weight: 600; color: var(--berry); }

/* the block tree */
.tree { padding: 8px 14px 32px; flex: 1; overflow: auto; position: relative; min-height: 0; }
/* no borders: a block is its tint, and its name is in its colour. Only the selected block gets an edge (its glow). */
.blk { --c: var(--lemon); border-radius: 8px; background: color-mix(in srgb, var(--c) 13%, white); margin: 4px 0; touch-action: none; }
.blk > .bh .name, .blk > .bh .tag, .blk > .lid { color: color-mix(in srgb, var(--c) 65%, var(--ink)); }
.blk.page { --c: var(--ink-soft); background: #faf7ff; }
.blk.selected { box-shadow: var(--chosen); position: relative; z-index: 1; }
/* the page itself is selected when nothing else is: no glow round everything */
.blk.page.selected { box-shadow: none; }
.blk.hover:not(.selected) { box-shadow: var(--hover); animation: hover-in .25s ease-out; }
/* a hover outline fades in; it goes at once, because the animation leaves with the class */
@keyframes hover-in { from { box-shadow: 0 0 0 1.5px rgba(36, 19, 59, 0); } }
.blk.dragging { opacity: .35; }
.blk.flash { animation: flash .7s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--c) 60%, white); } }
.bh { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: grab; font-weight: 500; font-size: 13px; min-height: 28px; }
.bh .grip { color: var(--ink-soft); font-size: 14px; line-height: 1; }
.bh .tag { display: none; color: var(--ink); }
.kids { padding: 0 6px 4px 16px; }
.kids:empty::after { content: 'empty: drag something in, or press a + button'; display: block; color: var(--ink-soft); font-weight: 400; font-size: 12px; padding: 2px 0; }
.blk.page > .kids { padding-left: 8px; }
.text { --c: #c9c0d6; display: flex; align-items: center; gap: 6px; border-radius: 6px; background: #fff; margin: 3px 0; padding: 0 6px; touch-action: none; }
.text.selected { box-shadow: var(--chosen); position: relative; z-index: 1; }
.text .grip { color: var(--ink-soft); cursor: grab; }
.text input { flex: 1; min-width: 60px; border: 0; font: 400 13.5px Lexend, sans-serif; color: var(--ink); background: transparent; padding: 3px 0; }
.text input:focus { outline: none; }
.ws-note { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
/* tags revealed: every block shows its opening tag on top and its lid underneath */
.tags .bh .name { display: none; }
.tags .bh .tag, .tags .lid { display: block; font-family: 'JetBrains Mono', monospace; font-weight: 500; }
.lid { display: none; padding: 0 8px 4px; font-size: 13px; }
.tags .blk.page > .bh .tag, .tags .blk.page > .lid { color: var(--ink-soft); }
.tags .text input { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
.drop-line { position: absolute; height: 3px; background: var(--lime); border-radius: 2px; pointer-events: none; box-shadow: 0 0 0 1px var(--ink); display: none; }
.drop-line.bad { background: var(--berry); }
.drop-box { position: absolute; border: 2px dashed var(--lime); border-radius: 10px; pointer-events: none; display: none; }
.drop-box.bad { border-color: var(--berry); }
.ghost .why { display: none; margin-top: 4px; font-size: 12.5px; color: var(--berry); transform: rotate(3deg); white-space: normal; max-width: 280px; }
.ghost.bad .why { display: block; }
.ghost.bad { border-color: var(--berry); }
/* why a drop didn't work: shown where the block was let go, then fading away */
.drop-note { position: fixed; z-index: 11; pointer-events: none; max-width: 300px; background: #fff; border: 1.5px solid var(--berry); border-radius: 8px; padding: 3px 9px; font: 500 12.5px/1.4 Lexend, sans-serif; color: var(--ink); box-shadow: 2px 2px 0 rgba(36, 19, 59, .2); transition: opacity .4s; }
.drop-note b { color: var(--berry); }
.drop-note.gone { opacity: 0; }
/* while a block is carried, nothing gets text-selected along the way */
body.carrying, body.carrying * { user-select: none; -webkit-user-select: none; cursor: grabbing; }
.ghost { position: fixed; pointer-events: none; z-index: 10; padding: 4px 10px; border: var(--line) solid var(--ink); border-radius: 8px; background: var(--c); font-weight: 500; font-size: 13px; box-shadow: var(--shadow); transform: rotate(-3deg); }

/* the page */
/* the page is a real browser page in a frame, with the browser's own look: nothing here styles it */
.page-frame { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.bw-tab { padding: 6px 10px 0; background: #ece6f5; border-bottom: 1px solid var(--soft); }
.bw-tab span { display: inline-block; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #fff; border: 1px solid var(--soft); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 3px 12px; font-size: 12.5px; }
.page-frame iframe { flex: 1; border: 0; width: 100%; background: #fff; }
/* the HTML view: the real text of the page, which can be edited (and broken) */
.html-edit { flex: 1; display: none; flex-direction: column; padding: 8px 12px 12px; gap: 8px; min-height: 0; }
.panel.html .html-edit { display: flex; }
.panel.html .tree, .panel.html .palette, .panel.html .tools { display: none; }
.panel.broken .palette, .panel.broken .tools { display: none; }
.html-edit textarea { flex: 1; min-height: 0; resize: none; border: 1px solid var(--soft); border-radius: 8px; padding: 8px 10px; font: 500 13px/1.6 'JetBrains Mono', monospace; font-variant-ligatures: none; color: var(--ink); tab-size: 2; white-space: pre; }
.html-edit textarea:focus { outline: 2px solid var(--grape); outline-offset: -1px; }
.html-edit textarea::selection { background: #ffd34d; color: var(--ink); }
.code-wrap { position: relative; flex: 1; display: flex; min-height: 0; }
/* mistakes: a soft band on the line, and a note just under it, fading in after typing stops */
.marks { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 8px; }
.mark-line { position: absolute; left: 1px; right: 1px; background: rgba(255, 77, 109, .12); border-left: 3px solid var(--berry); opacity: 0; transition: opacity .3s; }
.bubble { position: absolute; max-width: calc(100% - 20px); background: #fff; border: 1.5px solid var(--berry); border-radius: 8px; padding: 2px 8px; font: 500 12.5px/1.4 Lexend, sans-serif; color: var(--ink); box-shadow: 2px 2px 0 rgba(36, 19, 59, .2); opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .3s; }
.bubble b { color: var(--berry); }
.marks.show .mark-line, .marks.show .bubble { opacity: 1; transform: none; }
.check { font-size: 13px; min-height: 18px; opacity: 0; transition: opacity .3s; }
.check.show { opacity: 1; }
.check .ok { color: #2d8a12; font-weight: 600; }
.check .bad { color: var(--berry); font-weight: 600; margin: 2px 0; }
.banner { display: none; margin: 6px 12px 0; padding: 6px 10px; border-radius: 8px; background: #fff3c4; border: 1px solid var(--lemon); font-size: 13px; }
.panel.broken:not(.html) .banner { display: block; }
.blk.other { --c: #a7a7a7; }
/* the website bar: one tab per page */
.site { display: flex; align-items: center; gap: 8px; padding: 0 16px 10px; flex-wrap: wrap; }
.site .lbl { font-weight: 600; font-size: 13px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tabs button, .tabs .tab { font: 500 12.5px 'JetBrains Mono', monospace; border: var(--line) solid var(--ink); border-radius: 8px; padding: 3px 9px; background: var(--card); color: var(--ink); cursor: pointer; }
.tabs .tab.on { background: var(--lilac); box-shadow: 0 0 0 2px var(--gold); display: inline-flex; gap: 6px; align-items: center; cursor: default; }
.tabs .tab.on button { font: inherit; border: 0; padding: 0 2px; background: none; cursor: pointer; }
.tabs .tab input { font: inherit; width: 140px; border: 1px solid var(--soft); border-radius: 5px; padding: 0 4px; }
.tabs .add { font-family: Lexend, sans-serif; background: var(--lime); }
.tabs .del { font-family: Lexend, sans-serif; background: #ffd0d8; }
.back { font: 500 12px Lexend, sans-serif; border: var(--line) solid var(--ink); border-radius: 8px; padding: 1px 8px; background: var(--card); cursor: pointer; margin-left: 8px; vertical-align: 2px; }
/* visiting: the page works like a website, with no selecting and no outlines */

/* the "+" buttons, in groups */
.palette { flex-direction: column; gap: 4px; }
.pgroup { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.pgroup > span { font-size: 11.5px; color: var(--ink-soft); width: 104px; flex: none; }
/* a block's own settings: which picture, where a link goes, a text box's name */
.tools .trow { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tools .pic { padding: 1px 3px; background: #fff; }
.tools .pic img { width: 30px; height: 25px; display: block; }
.tools .pic[aria-pressed=true] { outline: 2px solid var(--gold); outline-offset: 1px; background: #fff3c4; }
.tools .field { display: flex; align-items: center; gap: 6px; font-size: 12.5px; flex: 1; min-width: 220px; }
.tools .field input { flex: 1; min-width: 80px; font: 500 12.5px 'JetBrains Mono', monospace; border: 1px solid var(--soft); border-radius: 6px; padding: 3px 6px; }
.tools .field input:focus { outline: 2px solid var(--grape); outline-offset: -1px; }
.bh .thumb { width: 26px; height: 22px; }
.tags .bh .thumb { display: none; }
.blk.single > .bh { min-height: 32px; }
/* the page: tables show their cells, and the card that says what a form would send */

.panel.pagep { position: relative; }
.send-card { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); width: min(380px, 90%); background: #fff; border: var(--line) solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 4px var(--gold), var(--shadow); padding: 12px 16px; z-index: 5; }
.send-card h3 { font: 400 16px 'Titan One', sans-serif; margin: 0 0 6px; }
.send-card ul { margin: 6px 0; padding-left: 20px; }
.send-card .later { color: var(--ink-soft); font-size: 13px; }
.send-card button { font: 600 13px Lexend, sans-serif; border: var(--line) solid var(--ink); border-radius: 8px; padding: 3px 14px; background: var(--lime); cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Page blocks</h1>
  <p>A web page is boxes inside boxes. Add blocks, drag them anywhere, and watch the page change.</p>
</header>
<nav class="site" aria-label="Your website's pages"><span class="lbl">Your website:</span><div class="tabs" id="tabs"></div></nav>
<main>
  <section class="panel" id="left" aria-label="Blocks">
    <h2>Your page, as <div class="views" role="group" aria-label="Show the page as"><button data-view="blocks" aria-pressed="true">Blocks</button><button data-view="tags" aria-pressed="false">Tags</button><button data-view="html" aria-pressed="false">HTML</button></div></h2>
    <div class="palette" id="palette"></div>
    <div class="tools" id="tools"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="banner" id="banner">Your HTML has a mistake, so this is the browser's best guess at what you meant. Go back to <b>HTML</b> to fix it.</div>
    <div class="html-edit"><div class="code-wrap"><textarea id="htmlText" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="The page's HTML"></textarea><div class="marks" id="marks" aria-hidden="true"></div></div><div class="check" id="check" aria-live="polite"></div></div>
    <div class="tree" id="tree"><div class="drop-line" id="dropLine"></div><div class="drop-box" id="dropBox"></div></div>
  </section>
  <section class="panel pagep" aria-label="The page">
    <h2><span>The page <button class="back" id="back" hidden>← Back</button></span><div class="views" id="modes" role="group" aria-label="Edit or visit the page"><button data-mode="edit" aria-pressed="true" title="Click anything on the page to find its block">Edit</button><button data-mode="visit" aria-pressed="false" title="Use the page like a real website: links take you to your other pages">Visit</button></div></h2>
    <div class="page-frame"><div class="bw-tab" aria-label="The browser tab"><span id="pageTitle"></span></div><iframe id="pageFrame" sandbox="allow-same-origin allow-forms" title="The page"></iframe></div>
    <div class="send-card" id="sendCard" role="dialog" aria-label="What the website would receive" hidden></div>
    <div class="help-pop" id="helpPop" role="dialog" aria-label="How to add this" hidden></div>
  </section>
</main>
<script>
// What may go inside a block that holds words: words, bold, italic, links and pictures.
const WORDY = ['text', 'bold', 'italic', 'link', 'picture'];
// Kinds of block: the friendly name, the real tag, the colour, what may go inside, and which group of "+" buttons it is in.
// single: a block with nothing inside, written as one tag that closes itself (<img/>).
const KINDS = {
  page: { name: 'Page', tag: 'body', c: 'var(--ink-soft)', holds: ['heading', 'para', 'list', 'table', 'form', 'picture'] },
  heading: { name: 'Heading', tag: 'h1', c: 'var(--berry)', holds: WORDY, group: 'Words' },
  para: { name: 'Paragraph', tag: 'p', c: 'var(--blue)', holds: [...WORDY, 'textbox', 'button'], group: 'Words' },
  text: { name: 'Words', c: '#c9c0d6', holds: [], group: 'Words' },
  bold: { name: 'Bold', tag: 'b', c: 'var(--orange)', holds: ['text', 'bold', 'italic', 'link'], group: 'Words' },
  italic: { name: 'Italic', tag: 'i', c: 'var(--lime)', holds: ['text', 'bold', 'italic', 'link'], group: 'Words' },
  list: { name: 'List', tag: 'ul', c: 'var(--grape)', holds: ['item'], group: 'Lists and tables' },
  item: { name: 'List item', tag: 'li', c: '#c58bff', holds: [...WORDY, 'textbox', 'button'], group: 'Lists and tables' },
  table: { name: 'Table', tag: 'table', c: '#1fa5a0', holds: ['row'], group: 'Lists and tables' },
  row: { name: 'Row', tag: 'tr', c: '#4cc4bf', holds: ['cell'], group: 'Lists and tables' },
  cell: { name: 'Cell', tag: 'td', c: '#8ddcd8', holds: [...WORDY, 'textbox', 'button'], group: 'Lists and tables' },
  link: { name: 'Link', tag: 'a', c: '#2f7bff', holds: ['text', 'bold', 'italic', 'picture'], group: 'Links and pictures' },
  picture: { name: 'Picture', tag: 'img', c: '#e0a100', holds: [], single: true, group: 'Links and pictures' },
  form: { name: 'Form', tag: 'form', c: '#d0457a', holds: ['para', 'textbox', 'button'], group: 'Forms' },
  textbox: { name: 'Text box', tag: 'input', c: '#e98ab0', holds: [], single: true, group: 'Forms' },
  button: { name: 'Button', tag: 'button', c: '#f2b8cf', holds: ['text', 'bold', 'italic'], group: 'Forms' },
};
// Why a block can't go somewhere, in a child's words.
const WHY_NOT = {
  heading: 'A heading goes straight on the page.',
  para: 'A paragraph goes straight on the page, or in a form.',
  text: 'Words go inside a heading, a paragraph, a list item, a cell, a link, a button, bold or italic.',
  bold: 'Bold goes inside words: a heading, a paragraph, a list item, a cell, a link, a button or italic.',
  italic: 'Italic goes inside words: a heading, a paragraph, a list item, a cell, a link, a button or bold.',
  list: 'A list goes straight on the page.',
  item: 'A list item only goes inside a list.',
  table: 'A table goes straight on the page.',
  row: 'A row only goes inside a table.',
  cell: 'A cell only goes inside a row.',
  link: 'A link goes inside words: a heading, a paragraph, a list item, a cell, bold or italic. Not inside another link.',
  picture: 'A picture goes on the page, or inside a heading, a paragraph, a list item, a cell or a link.',
  form: 'A form goes straight on the page.',
  textbox: 'A text box goes in a form, or in a paragraph, a list item or a cell.',
  button: 'A button goes in a form, or in a paragraph, a list item or a cell.',
};
KINDS.other = { name: 'Not in this lesson', c: '#a7a7a7', holds: [] };
KINDS.other.holds = Object.keys(KINDS);
const TAG_KIND = { ...Object.fromEntries(Object.entries(KINDS).filter(([, k]) => k.tag).map(([id, k]) => [k.tag, id])), th: 'cell' };
// blocks that hold words: their HTML goes on one line; the others put each block inside on its own line
const INLINE = new Set(['heading', 'para', 'item', 'cell', 'bold', 'italic', 'link', 'button']);
// the attributes this lesson uses, in the order they are written
const ATTRS = ['href', 'src', 'alt', 'name'];
const INDENT = '  ';
const COLOURS = [['none', null], ['tomato', 'tomato'], ['hotpink', 'hotpink'], ['royalblue', 'royalblue'], ['seagreen', 'seagreen'], ['darkorange', 'darkorange'], ['purple', 'purple']];
const FLASH_MS = 700, DRAG_START_PX = 6, EDGE = .3;
// The pictures in this pretend website's folder. Any other name is a picture that isn't there, as on a real site.
const svg = (body) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">${body}</svg>`);
const PICS = {
  'jelly.svg': svg('<path d="M20 85 Q14 30 60 22 Q106 30 100 85 Z" fill="#62c934" stroke="#24133b" stroke-width="4"/><circle cx="46" cy="52" r="8" fill="#fff" stroke="#24133b" stroke-width="3"/><circle cx="74" cy="52" r="8" fill="#fff" stroke="#24133b" stroke-width="3"/><circle cx="47" cy="54" r="3.5" fill="#24133b"/><circle cx="75" cy="54" r="3.5" fill="#24133b"/><path d="M48 70 Q60 80 72 70" fill="none" stroke="#24133b" stroke-width="4" stroke-linecap="round"/>'),
  'gerbil.svg': svg('<ellipse cx="62" cy="62" rx="40" ry="28" fill="#d99a5b" stroke="#24133b" stroke-width="4"/><circle cx="34" cy="40" r="12" fill="#f2c08f" stroke="#24133b" stroke-width="4"/><circle cx="30" cy="58" r="4" fill="#24133b"/><circle cx="18" cy="64" r="3" fill="#ff4d6d"/><path d="M100 70 Q116 60 112 40" fill="none" stroke="#24133b" stroke-width="4" stroke-linecap="round"/>'),
  'star.svg': svg('<path d="M60 8 L73 38 L106 40 L80 61 L89 93 L60 75 L31 93 L40 61 L14 40 L47 38 Z" fill="#ffc61a" stroke="#24133b" stroke-width="4" stroke-linejoin="round"/>'),
};

let nextId = 1;
const node = (kind, kids = [], extra = {}) => ({ id: nextId++, kind, kids, style: null, attrs: {}, ...extra });
const words = (text) => node('text', [], { text });
// A fresh block of each kind, with something in it, so it shows up on the page straight away.
const FRESH = {
  heading: () => node('heading', [words('New heading')]),
  para: () => node('para', [words('New paragraph.')]),
  text: () => words('more words'),
  bold: () => node('bold', [words('bold words')]),
  italic: () => node('italic', [words('italic words')]),
